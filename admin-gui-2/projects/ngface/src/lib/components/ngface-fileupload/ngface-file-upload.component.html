<div class="upload-root">
  @if (files.length === 0) {
    <div>
      <div class="upload-drop-zone">
        <input
          #fileInput
          type="file"
          accept="{{fileType}}"
          [attr.multiple]="multiple ? '' : null"
          (change)="onFileInput($event)"
          />
        <button mat-fab color="primary" (click)="fileInput.click()">
          <mat-icon>attach_file</mat-icon>
        </button>
        <p class="upload-drop-zone-text">{{ dropZoneText }}</p>
      </div>
    </div>
  }

  <div class="upload-item-container">
    @for (fileStatus of files; track fileStatus; let i = $index) {
      <upload-item
        [httpUrl]="httpUrl"
        [file]="fileStatus.file"
        [id]="i"
        (removeItem)="removeItem($event)"
        (onUpload)="emitUpload($event)"
      ></upload-item>
    }
  </div>

  @if (getCountOpen() > 0 && multiple) {
    <div class="ngface-row">
      @if (files.length > 0) {
        <button class="ngface-button"
          [color]="uploadAllColor"
          mat-raised-button
          (click)="uploadAll()"
          [matBadge]="getBadge()"
          matBadgeColor="warn"
          >
          {{ uploadAllLabel }}
        </button>
      }
      @if (files.length > 0) {
        <button class="ngface-button"
          mat-raised-button
          [color]="removeAllColor"
          (click)="removeAll()"
          [matBadge]="getBadge()"
          matBadgeColor="warn"
          >
          {{ removeAllLabel }}
        </button>
      }
    </div>
  }
</div>
